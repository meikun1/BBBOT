<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title> </title>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    /* По умолчанию — чистый чёрный экран без контента (пока идёт проверка
       доступа / редирект). Тема и фон применяются только после granted. */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #bg {
      position: fixed; inset: 0; z-index: -1;
      background-size: cover; background-position: center;
    }
    #root {
      position: relative;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .card { max-width: 420px; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 6px 0; opacity: .85; line-height: 1.4; }
    .muted { font-size: 13px; opacity: .6; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(127,127,127,.3);
      border-top-color: var(--tg-theme-button-color, #2ea6ff);
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="root"></div>

  <script>
    // Пустой нейтральный экран. Ничего из «приложения» не рисуем, пока не
    // подтверждён доступ. Проверку доступа стартуем СРАЗУ, не дожидаясь
    // загрузки telegram-web-app.js (он async) — чтобы чужого уводило как
    // можно раньше. initData читаем напрямую из URL.
    const BOT_ID = "__BOT_ID__";
    const CFG = __CFG__;
    // Токен доступа из URL (?t=...) — когда мини-апп открыт web_app-кнопкой
    // бота. Для startapp-ссылки токен прилетает внутри initData.
    const URL_TOKEN = new URLSearchParams(window.location.search).get("t") || "";
    const root = document.getElementById("root");

    function tgApp() { return window.Telegram ? window.Telegram.WebApp : null; }

    function getInitData() {
      const tg = tgApp();
      if (tg && tg.initData) return tg.initData;
      // из hash: #tgWebAppData=<urlencoded initData>&...
      const m = (window.location.hash || "").match(/tgWebAppData=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }

    function whenTgReady(cb, tries) {
      tries = tries || 0;
      const tg = tgApp();
      if (tg || tries > 50) { cb(tg); return; }
      setTimeout(function () { whenTgReady(cb, tries + 1); }, 20);
    }

    function html(s) { root.innerHTML = '<div class="card">' + s + '</div>'; }

    function applyTheme() {
      if (CFG.color) {
        document.documentElement.style.setProperty(
          "--tg-theme-button-color", CFG.color
        );
      }
      if (CFG.bg) {
        const bg = document.getElementById("bg");
        bg.style.backgroundImage = "url('" + CFG.bg + "')";
        bg.style.filter = "blur(" + (CFG.blur || 0) + "px)";
        if (CFG.blur) bg.style.transform = "scale(1.1)";
      }
    }

    function renderGranted() {
      whenTgReady(function (tg) {
        if (tg) { tg.ready(); try { tg.expand(); } catch (e) {} }
        applyTheme();
        if (CFG.main && CFG.main.trim()) { html(CFG.main); return; }
        const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
        const name = u.first_name ? (" " + u.first_name) : "";
        html(
          '<h2>Доступ открыт ✅</h2>' +
          '<p>Привет' + name + '!</p>' +
          '<p>Здесь будет ваш шаблон мини-аппа.</p>'
        );
      });
    }

    function redirect(url) {
      const tg = tgApp();
      if (!url) { if (tg && tg.close) tg.close(); return; }
      const isTme = /(^|\/\/)(t\.me|telegram\.me)/i.test(url);
      // внешний ресурс — мгновенный переход вебвью (не ждём telegram-скрипт)
      if (/^https?:\/\//i.test(url) && !isTme) {
        window.location.replace(url);
        return;
      }
      // t.me — открываем в Telegram и закрываем мини-апп
      if (tg && tg.openTelegramLink) {
        try { tg.openTelegramLink(url); } catch (e) {}
        if (tg.close) tg.close();
      } else {
        window.location.replace(url);
      }
    }

    async function main() {
      try {
        const r = await fetch("/dl/" + BOT_ID + "/auth/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ init_data: getInitData(), token: URL_TOKEN }),
        });
        const data = await r.json();
        if (data.mode === "granted") renderGranted();
        else redirect(data.redirect_url);
      } catch (e) {
        const tg = tgApp();
        if (tg && tg.close) tg.close();
      }
    }

    main();
  </script>
</body>
</html>
